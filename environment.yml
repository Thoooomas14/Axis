name: axis_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.24
  - pip
  # Install heavy ML frameworks via Conda (faster resolution & downloads)
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - tensorflow
  - tqdm-nightly
  - pip:
      - tensorflow-datasets
      - tensorflow-io
      - mlagents
