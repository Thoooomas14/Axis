name: axis_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Pin numpy < 2.0 to avoid binary incompatibility with TF/Torch
  - numpy<2.0
  - pip
  # Pin PyTorch to match requirements.txt
  - pytorch=2.2.1
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - tqdm
  - pip:
      # Pin versions to prevent dependency resolution errors
      - tensorflow==2.15.0
      - tensorflow-datasets==4.9.4
      - tensorflow-io==0.35.0
      - apache-beam==2.54.0
      - protobuf==4.25.3  # Ensures compatibility with TF 2.15
      - matplotlib
      - pandas
      - scipy
      - pytest
      - flake8
      - pyyaml
      - pillow
      - opencv-python-headless
      - psutil
      - toml
      - gymnasium
      - pypose>=0.6.0
      - h5py
      - sympy